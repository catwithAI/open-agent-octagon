name: sandbox-image

# agent 运行时镜像（spec: docs/specs/260909-agent-sandbox 需求 3.8）。
# 镜像大、构建慢，且每个版本就是一个新的被测环境；仅 release(sandbox-v*) 或
# 手动触发。流程照抄 blade-agent 的 sandbox-image.yml：amd64 + arm64 分别构建，
# 推阿里云（评测机 pull）与 ghcr（buildx cache），最后合并 manifest。

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本 tag（如 sandbox-v0.1.0），不填则只构建不推送"
        required: false
        type: string
      envs_repo:
        description: "场景仓库（owner/repo），用于合并 meta.yaml prerequisites.python"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: octagon-agent-runtime
  ALIYUN_REGISTRY: registry.cn-beijing.aliyuncs.com
  ALIYUN_NAMESPACE: bladeai
  GHCR_REGISTRY: ghcr.io
  GHCR_NAMESPACE: ${{ github.repository_owner }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'sandbox-v')
    outputs:
      aliyun_image: ${{ steps.meta.outputs.aliyun_image }}
      ghcr_image: ${{ steps.meta.outputs.ghcr_image }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      should_push: ${{ steps.meta.outputs.should_push }}
    steps:
      - name: Prepare image metadata
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          aliyun_image="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${IMAGE_NAME}"
          ghcr_image="${GHCR_REGISTRY}/${GHCR_NAMESPACE}/${IMAGE_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            release_tag="${GITHUB_REF_NAME#sandbox-}"
            should_push="true"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_VERSION}" ]; then
            release_tag="${INPUT_VERSION#sandbox-}"
            should_push="true"
          else
            release_tag="manual-${GITHUB_RUN_ID}"
            should_push="false"
          fi
          {
            echo "aliyun_image=${aliyun_image}"
            echo "ghcr_image=${ghcr_image}"
            echo "release_tag=${release_tag}"
            echo "should_push=${should_push}"
          } >> "${GITHUB_OUTPUT}"

  build-and-publish:
    needs: prepare
    name: build-and-publish (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # 场景仓库可选：有则合并各场景 meta.yaml 的 prerequisites.python。
      - uses: actions/checkout@v4
        if: github.event.inputs.envs_repo != ''
        with:
          repository: ${{ github.event.inputs.envs_repo }}
          path: external-envs
          token: ${{ secrets.ENVS_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Collect scenario python prerequisites
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          roots=(envs)
          [ -d external-envs ] && roots+=(external-envs)
          python3 docker/agent-runtime/collect_env_requirements.py "${roots[@]}" \
            > docker/agent-runtime/requirements-envs.generated.txt
          cat docker/agent-runtime/requirements-envs.generated.txt

      - name: Load pinned versions
        id: versions
        shell: bash
        run: |
          {
            echo "build_args<<EOF"
            grep -v '^\s*#' docker/agent-runtime/versions.env | grep -v '^\s*$'
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Free disk space
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/dotnet
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun registry
        if: needs.prepare.outputs.should_push == 'true'
        shell: bash
        env:
          ALIYUN_USERNAME: ${{ vars.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: echo "${ALIYUN_PASSWORD}" | docker login "${ALIYUN_REGISTRY}" -u "${ALIYUN_USERNAME}" --password-stdin

      - name: Login to GHCR (buildx cache)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build agent runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent-runtime/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ needs.prepare.outputs.should_push == 'true' }}
          load: ${{ needs.prepare.outputs.should_push != 'true' }}
          tags: ${{ needs.prepare.outputs.aliyun_image }}:${{ needs.prepare.outputs.release_tag }}-${{ matrix.arch }}
          provenance: false
          cache-from: type=registry,ref=${{ needs.prepare.outputs.ghcr_image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ needs.prepare.outputs.ghcr_image }}:buildcache-${{ matrix.arch }},mode=min,ignore-error=true
          build-args: ${{ steps.versions.outputs.build_args }}

      - name: Smoke test
        shell: bash
        run: |
          image="${{ needs.prepare.outputs.aliyun_image }}:${{ needs.prepare.outputs.release_tag }}-${{ matrix.arch }}"
          if [ "${{ needs.prepare.outputs.should_push }}" = "true" ]; then docker pull "${image}"; fi
          docker/agent-runtime/smoke.sh "${image}"

  publish-manifest:
    needs:
      - prepare
      - build-and-publish
    if: needs.prepare.outputs.should_push == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Login to Aliyun registry
        shell: bash
        env:
          ALIYUN_USERNAME: ${{ vars.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: echo "${ALIYUN_PASSWORD}" | docker login "${ALIYUN_REGISTRY}" -u "${ALIYUN_USERNAME}" --password-stdin
      - name: Publish multi-arch tag
        shell: bash
        env:
          TARGET_IMAGE: ${{ needs.prepare.outputs.aliyun_image }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${TARGET_IMAGE}:${RELEASE_TAG}" \
            "${TARGET_IMAGE}:${RELEASE_TAG}-amd64" \
            "${TARGET_IMAGE}:${RELEASE_TAG}-arm64"
          docker buildx imagetools inspect "${TARGET_IMAGE}:${RELEASE_TAG}"
